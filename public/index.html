<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#F5F5F7">
  <title>MESA · Mantenimiento Planta Ramos</title>
  <script>document.documentElement.dataset.theme=localStorage.getItem('mesa-theme')||'dark';</script>
  <link rel="stylesheet" href="/styles.css?v=20260908-1">
  <link rel="stylesheet" href="/mesa.css?v=20260909-2">
</head>
<body>
  <a class="skip-link" href="#content">Ir al contenido</a>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand"><span class="brand-mark">M</span><div><strong>MESA</strong><small>Planta Ramos</small></div></div>
      <nav id="nav">
        <button class="nav-item active" data-view="dashboard"><span>⌂</span> Panel general</button>
        <button class="nav-item" data-view="orders"><span>≡</span> Órdenes de trabajo</button>
        <button class="nav-item" data-view="assets"><span>◇</span> Activos</button>
        <button class="nav-item" data-view="inventory"><span>▣</span> Inventario</button>
        <button class="nav-item" data-view="preventives"><span>✓</span> Preventivos</button>
        <button class="nav-item" data-view="downtime"><span>!</span> Paros y agenda</button>
        <button class="nav-item" data-view="users"><span>♙</span> Usuarios</button>
      </nav>
      <small class="app-version">Versión 0.5 · Expedientes</small><div class="sidebar-foot"><span class="avatar" id="user-avatar">—</span><div class="session-user"><strong id="session-name">—</strong><small id="session-role">—</small></div><button class="logout" id="logout" title="Cerrar sesión">↪</button></div>
    </aside>
    <main>
      <header class="topbar"><button class="menu" id="menu">☰</button><div><h1 id="page-title">Panel general</h1><p id="page-subtitle">Resumen operativo de Planta Ramos</p></div><div class="top-actions"><button class="theme-toggle" id="theme-toggle" type="button" aria-label="Cambiar tema"></button><button class="notification" id="notification" title="Órdenes abiertas">🔔<span id="notification-count">0</span></button><button class="topbar-logout" id="mobile-logout" title="Cerrar sesión">↪ Salir</button><div class="today" id="today"></div></div></header>
      <div id="connection-status" class="connection-status" role="status" hidden></div>
      <div id="content" class="content" tabindex="-1"></div>
    </main>
    <button class="fab-btn" id="fab-new-order" title="Nueva Orden de Trabajo">＋</button>
    <nav class="bottom-nav" id="bottom-nav">
      <button class="bottom-nav-item active" data-view="dashboard"><span class="nav-icon">⌂</span><span class="nav-label">Inicio</span></button>
      <button class="bottom-nav-item" data-view="orders"><span class="nav-icon">≡</span><span class="nav-label">Órdenes</span></button>
      <button class="bottom-nav-item" data-view="assets"><span class="nav-icon">◇</span><span class="nav-label">Activos</span></button>
      <button class="bottom-nav-item" data-view="inventory"><span class="nav-icon">▣</span><span class="nav-label">Inventario</span></button>
      <button class="bottom-nav-item" data-view="preventives"><span class="nav-icon">✓</span><span class="nav-label">Preventivos</span></button>
      <button class="bottom-nav-item" data-view="users"><span class="nav-icon">♙</span><span class="nav-label">Usuarios</span></button>
    </nav>
  </div>
  <div class="login-screen" id="login-screen">
    <form class="login-card" id="login-form">
      <div class="login-logo">M</div><h1>MESA Mantenimiento</h1><p>Planta Ramos · Acceso al sistema</p>
      <label>Usuario<input name="username" autocomplete="username" required autofocus></label>
      <label>Contraseña<input name="password" type="password" autocomplete="current-password" required></label>
      <div class="login-error" id="login-error"></div><button class="btn btn-primary">Iniciar sesión</button>
    </form>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="/ui.js?v=20260909-2"></script>
<script src="/app.js?v=20260909-12"></script>
</body>
</html>
