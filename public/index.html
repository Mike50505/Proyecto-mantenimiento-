<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#172b3a">
  <title>MESA Mantenimiento</title>
  <link rel="stylesheet" href="/styles.css?v=20260903-2">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand"><span class="brand-mark">M</span><div><strong>MESA</strong><small>Planta Ramos</small></div></div>
      <nav id="nav">
        <button class="nav-item active" data-view="dashboard"><span>⌂</span> Panel general</button>
        <button class="nav-item" data-view="orders"><span>≡</span> Órdenes de trabajo</button>
        <button class="nav-item" data-view="assets"><span>◇</span> Activos</button>
        <button class="nav-item" data-view="preventives"><span>✓</span> Preventivos</button>
        <button class="nav-item" data-view="users"><span>♙</span> Usuarios</button>
      </nav>
      <small class="app-version">Versión 0.5 · Expedientes</small><div class="sidebar-foot"><span class="avatar" id="user-avatar">—</span><div class="session-user"><strong id="session-name">—</strong><small id="session-role">—</small></div><button class="logout" id="logout" title="Cerrar sesión">↪</button></div>
    </aside>
    <main>
      <header class="topbar"><button class="menu" id="menu">☰</button><div><h1 id="page-title">Panel general</h1><p id="page-subtitle">Resumen operativo de Planta Ramos</p></div><div class="top-actions"><button class="notification" id="notification" title="Órdenes abiertas">🔔<span id="notification-count">0</span></button><div class="today" id="today"></div></div></header>
      <div id="content" class="content"></div>
    </main>
  </div>
  <div class="login-screen" id="login-screen">
    <form class="login-card" id="login-form">
      <div class="login-logo">M</div><h1>MESA Mantenimiento</h1><p>Planta Ramos · Acceso al sistema</p>
      <label>Usuario<input name="username" autocomplete="username" required autofocus></label>
      <label>Contraseña<input name="password" type="password" autocomplete="current-password" required></label>
      <div class="login-error" id="login-error"></div><button class="btn btn-primary">Iniciar sesión</button>
    </form>
  </div>
  <div class="toast" id="toast"></div>
  <script src="/app.js?v=20260903-2"></script>
</body>
</html>
